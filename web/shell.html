<!doctype html>
<!-- FP-RISC docsite shell — the STATIC half of the split. Shipped once,
     embedded into the server binary at build time by tools/docsgen.sol.
     Everything dynamic below is a small JSON fetch against the MVU
     model actor: /api/docs /api/doc /api/search /api/visit /api/recent -->
<html><head><meta charset="utf-8"><title>FP-RISC docs</title>
<style>
:root { --bg:#0e1116; --panel:#161b22; --edge:#2b3240; --ink:#d7dde6;
        --dim:#8b95a5; --acc:#4cc38a; --acc2:#5aa9e6; --hit:#f2cc60; }
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--ink);
       font:15px/1.55 -apple-system,'Segoe UI',Roboto,sans-serif; }
header { display:flex; align-items:center; gap:14px; padding:10px 18px;
         background:var(--panel); border-bottom:1px solid var(--edge);
         position:sticky; top:0; z-index:5; }
header .logo { font-weight:700; color:var(--acc); letter-spacing:.4px; }
header .logo span { color:var(--dim); font-weight:400; }
#tabs { display:flex; gap:4px; flex-wrap:wrap; flex:1; }
.tab { padding:5px 12px; border-radius:8px 8px 0 0; cursor:pointer;
       color:var(--dim); border:1px solid transparent; border-bottom:none;
       font-size:13.5px; user-select:none; }
.tab:hover { color:var(--ink); }
.tab.on { color:var(--acc); background:var(--bg);
          border-color:var(--edge); }
#searchbtn { background:var(--bg); color:var(--dim); cursor:pointer;
  border:1px solid var(--edge); border-radius:8px; padding:6px 14px;
  font-size:13px; }
#searchbtn:hover { color:var(--ink); border-color:var(--acc); }
#searchbtn kbd { background:var(--edge); border-radius:4px; padding:1px 6px;
  font-size:11px; margin-left:8px; }
#recent { display:flex; gap:8px; align-items:center; padding:8px 18px;
          color:var(--dim); font-size:12.5px; }
.chip { background:var(--panel); border:1px solid var(--edge);
        border-radius:999px; padding:2px 11px; cursor:pointer; }
.chip:hover { color:var(--acc); border-color:var(--acc); }
main { max-width:900px; margin:0 auto; padding:10px 24px 80px; }
main h1 { font-size:26px; margin:26px 0 10px; color:#fff; }
main h2 { font-size:20px; margin:24px 0 8px; color:var(--acc); }
main h3 { font-size:16.5px; margin:18px 0 6px; color:var(--acc2); }
main p { margin:8px 0; }
main pre { background:var(--panel); border:1px solid var(--edge);
  border-radius:10px; padding:12px 14px; overflow-x:auto; margin:10px 0;
  font:13px/1.5 ui-monospace,'SF Mono',Menlo,monospace; color:#c9e3ff; }
main code.inline { background:var(--panel); border-radius:5px;
  padding:1px 6px; font:13px ui-monospace,Menlo,monospace; color:#c9e3ff; }
main ul { margin:8px 0 8px 24px; }
mark { background:var(--hit); color:#000; border-radius:3px; padding:0 2px; }
#modalwrap { position:fixed; inset:0; background:rgba(0,0,0,.55);
  display:none; align-items:flex-start; justify-content:center;
  padding-top:9vh; z-index:20; backdrop-filter:blur(2px); }
#modalwrap.open { display:flex; }
#modal { width:640px; max-width:92vw; background:var(--panel);
  border:1px solid var(--edge); border-radius:14px;
  box-shadow:0 24px 70px rgba(0,0,0,.55); overflow:hidden; }
#q { width:100%; padding:15px 18px; font-size:16px; background:transparent;
  color:var(--ink); border:none; outline:none;
  border-bottom:1px solid var(--edge); }
#hits { max-height:52vh; overflow-y:auto; }
.hit { padding:10px 18px; cursor:pointer; border-bottom:1px solid #1c2330; }
.hit:hover, .hit.sel { background:#1b2230; }
.hit .where { color:var(--acc2); font-size:12px; margin-bottom:2px; }
.hit .line { color:var(--ink); font:12.5px ui-monospace,Menlo,monospace;
  white-space:pre-wrap; word-break:break-word; }
#hstat { padding:9px 18px; color:var(--dim); font-size:12px; }
footer { position:fixed; bottom:0; left:0; right:0; padding:6px 18px;
  background:var(--panel); border-top:1px solid var(--edge);
  color:var(--dim); font-size:11.5px; display:flex; justify-content:space-between; }
</style></head><body>
<header>
  <div class="logo">FP-RISC<span> / docs</span></div>
  <nav id="tabs"></nav>
  <button id="searchbtn">Search docs<kbd>ctrl K</kbd></button>
</header>
<div id="recent"></div>
<main id="doc"><p style="color:var(--dim)">loading…</p></main>
<div id="modalwrap"><div id="modal">
  <input id="q" placeholder="Search all docs… (content match, server-side)" autocomplete="off">
  <div id="hits"></div><div id="hstat"></div>
</div></div>
<footer><span id="who">served by an FP-RISC actor</span>
  <span id="stat"></span></footer>
<script>
'use strict';
const $ = s => document.querySelector(s);
let DOCS = [], CUR = null, SEL = 0, T = null;

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* markdown-lite: headings, fenced code, inline code, bullets, paras */
function render(md) {
  const out = []; let code = false, buf = [], list = false;
  const flushList = () => { if (list) { out.push('</ul>'); list = false; } };
  for (const raw of md.split('\n')) {
    if (raw.startsWith('```')) {
      if (code) { out.push('<pre>' + esc(buf.join('\n')) + '</pre>'); buf = []; }
      code = !code; continue;
    }
    if (code) { buf.push(raw); continue; }
    const l = raw;
    const inl = s => esc(s).replace(/`([^`]+)`/g, '<code class="inline">$1</code>')
                          .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    if (/^### /.test(l)) { flushList(); out.push('<h3>' + inl(l.slice(4)) + '</h3>'); }
    else if (/^## /.test(l)) { flushList(); out.push('<h2>' + inl(l.slice(3)) + '</h2>'); }
    else if (/^# /.test(l)) { flushList(); out.push('<h1>' + inl(l.slice(2)) + '</h1>'); }
    else if (/^[-*] /.test(l)) {
      if (!list) { out.push('<ul>'); list = true; }
      out.push('<li>' + inl(l.slice(2)) + '</li>');
    }
    else if (/^    /.test(l)) out.push('<pre>' + esc(l.slice(4)) + '</pre>');
    else if (l.trim() === '') flushList();
    else { flushList(); out.push('<p>' + inl(l) + '</p>'); }
  }
  return out.join('');
}

async function j(url, opt) { const r = await fetch(url, opt); return r.json(); }

async function openDoc(name, scrollLine) {
  CUR = name;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('on', t.dataset.n === name));
  const d = await j('/api/doc?n=' + encodeURIComponent(name));
  $('#doc').innerHTML = render(d.body);
  window.scrollTo(0, 0);
  if (scrollLine) {
    const frac = scrollLine / Math.max(1, d.body.split('\n').length);
    window.scrollTo(0, frac * document.body.scrollHeight * 0.9);
  }
  j('/api/visit', { method: 'POST', body: JSON.stringify({ doc: name }) })
    .then(loadRecent);
}

function loadRecent() {
  j('/api/recent').then(r => {
    $('#recent').innerHTML = r.recent.length
      ? 'recent: ' + r.recent.map(n =>
          `<span class="chip" data-n="${esc(n)}">${esc(n)}</span>`).join('')
      : '';
    document.querySelectorAll('#recent .chip').forEach(c =>
      c.onclick = () => openDoc(c.dataset.n));
  });
}

function modal(open) {
  $('#modalwrap').classList.toggle('open', open);
  if (open) { $('#q').value = ''; $('#hits').innerHTML = '';
              $('#hstat').textContent = ''; $('#q').focus(); }
}

async function search(q) {
  if (!q.trim()) { $('#hits').innerHTML = ''; $('#hstat').textContent = ''; return; }
  const r = await j('/api/search?q=' + encodeURIComponent(q));
  SEL = 0;
  $('#hits').innerHTML = r.hits.map((h, i) =>
    `<div class="hit${i === 0 ? ' sel' : ''}" data-d="${esc(h.doc)}" data-l="${h.line}">
       <div class="where">${esc(h.doc)} · line ${h.line}</div>
       <div class="line">${esc(h.text).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'), m => '<mark>' + m + '</mark>')}</div>
     </div>`).join('');
  $('#hstat').textContent = r.n + ' match(es) across ' + DOCS.length +
    ' docs — server-side scan in ' + r.us + ' preempt-checked microloops';
  document.querySelectorAll('.hit').forEach(el =>
    el.onclick = () => { modal(false); openDoc(el.dataset.d, +el.dataset.l); });
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); modal(true); }
  if (e.key === 'Escape') modal(false);
  const hits = [...document.querySelectorAll('.hit')];
  if ($('#modalwrap').classList.contains('open') && hits.length) {
    if (e.key === 'ArrowDown') { SEL = Math.min(SEL + 1, hits.length - 1); }
    else if (e.key === 'ArrowUp') { SEL = Math.max(SEL - 1, 0); }
    else if (e.key === 'Enter') { hits[SEL].click(); return; }
    else return;
    hits.forEach((h, i) => h.classList.toggle('sel', i === SEL));
    hits[SEL].scrollIntoView({ block: 'nearest' });
  }
});
$('#searchbtn').onclick = () => modal(true);
$('#modalwrap').onclick = e => { if (e.target.id === 'modalwrap') modal(false); };
$('#q').oninput = e => { clearTimeout(T); T = setTimeout(() => search(e.target.value), 140); };

(async function boot() {
  const d = await j('/api/docs');
  DOCS = d.docs;
  $('#tabs').innerHTML = DOCS.map(x =>
    `<div class="tab" data-n="${esc(x.name)}">${esc(x.title)}</div>`).join('');
  document.querySelectorAll('.tab').forEach(t =>
    t.onclick = () => openDoc(t.dataset.n));
  loadRecent();
  const st = await j('/api/status');
  $('#stat').textContent = `heap ${st.heap_kib} KiB · ${st.preempts} preempts · ${st.searches} searches served`;
  openDoc(DOCS[0].name);
})();
</script></body></html>
